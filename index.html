<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { display: flex; gap: 8px; padding: 10px; }
        #q { flex: 1; padding: 8px; font-size: 16px; }
        #msg { padding: 0 10px 10px; white-space: pre-wrap; }
        #map { height: 70vh; }
    </style>
</head>
<body>
    <div id="bar">
        <input id="q" placeholder="예: 서귀포 실내 / 동쪽 야외 / 제주시">
        <button id="go">찾기</button>
    </div>
    <div id="msg">지역(동쪽 · 서쪽 · 서귀포 · 제주시)과 실내/야외를 입력하세요.</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // jeju_spots.json 의 spots (파일 없이도 열리도록 내장)
        const spots = [
            {name:"성산일출봉", area:"동쪽", lat:33.4581, lon:126.9425, indoor:false, desc:"바다 위로 솟은 분화구 오름"},
            {name:"섭지코지", area:"동쪽", lat:33.424, lon:126.9306, indoor:false, desc:"바닷가 산책길과 등대"},
            {name:"아쿠아플라넷 제주", area:"동쪽", lat:33.433, lon:126.9277, indoor:true, desc:"대형 아쿠아리움"},
            {name:"만장굴", area:"동쪽", lat:33.5284, lon:126.7714, indoor:true, desc:"용암동굴 — 비 영향이 적음"},
            {name:"비자림", area:"동쪽", lat:33.4906, lon:126.8102, indoor:false, desc:"비자나무 숲길"},
            {name:"협재해수욕장", area:"서쪽", lat:33.394, lon:126.2397, indoor:false, desc:"에메랄드빛 바다와 비양도"},
            {name:"새별오름", area:"서쪽", lat:33.3657, lon:126.3567, indoor:false, desc:"억새로 유명한 오름"},
            {name:"오설록 티 뮤지엄", area:"서쪽", lat:33.3059, lon:126.2894, indoor:true, desc:"녹차 박물관과 차밭"},
            {name:"본태박물관", area:"서쪽", lat:33.303, lon:126.395, indoor:true, desc:"건축과 전통 공예 전시"},
            {name:"국립제주박물관", area:"제주시", lat:33.5139, lon:126.5487, indoor:true, desc:"제주 역사 · 문화 전시"},
            {name:"동문재래시장", area:"제주시", lat:33.5116, lon:126.5262, indoor:true, desc:"지붕 있는 전통시장 먹거리"},
            {name:"제주특별자치도 민속자연사박물관", area:"제주시", lat:33.5063, lon:126.53, indoor:true, desc:"제주의 자연과 생활 전시"},
            {name:"한라수목원", area:"제주시", lat:33.4697, lon:126.493, indoor:false, desc:"도심 가까운 숲 산책"},
            {name:"용두암", area:"제주시", lat:33.5164, lon:126.4919, indoor:false, desc:"용머리 모양 바위 해안"},
            {name:"천지연폭포", area:"서귀포", lat:33.2448, lon:126.5594, indoor:false, desc:"서귀포 폭포 산책로"},
            {name:"이중섭미술관", area:"서귀포", lat:33.2466, lon:126.5652, indoor:true, desc:"서귀포 거리의 미술관"},
            {name:"외돌개", area:"서귀포", lat:33.2398, lon:126.545, indoor:false, desc:"바다에 홀로 선 바위와 올레길"},
            {name:"쇠소깍", area:"서귀포", lat:33.2522, lon:126.6237, indoor:false, desc:"민물과 바다가 만나는 계곡"},
            {name:"중문 대포 주상절리대", area:"서귀포", lat:33.2378, lon:126.425, indoor:false, desc:"육각 기둥 모양 해안 절벽"},
        ]
        const AREAS = ["동쪽", "서쪽", "서귀포", "제주시"]

        // find_spots(area, indoor): indoor 를 생략(undefined)하면 실내/야외 구분 없음. 최대 8곳.
        const find_spots = (area, indoor) =>
            spots
                .filter((s) => s.area === area)
                .filter((s) => typeof indoor !== "boolean" || s.indoor === indoor)
                .slice(0, 8)

        // 입력 문장에서 지역과 실내/야외를 뽑는다.
        const parse = (text) => {
            const area = AREAS.find((a) => text.includes(a))
            let indoor
            if (text.includes("실내")) indoor = true
            else if (text.includes("야외") || text.includes("실외")) indoor = false
            return { area, indoor }
        }

        // OpenStreetMap 타일 지도 (제주 중심)
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)
        const msg = document.getElementById("msg")

        const search = () => {
            const { area, indoor } = parse(document.getElementById("q").value)
            layer.clearLayers()
            if (!area) {
                msg.textContent = "지역(동쪽 · 서쪽 · 서귀포 · 제주시)을 입력하세요."
                return
            }
            const found = find_spots(area, indoor)
            if (found.length === 0) {
                msg.textContent = "조건에 맞는 장소가 목록에 없습니다."
                return
            }
            msg.textContent = `${area} ${indoor === undefined ? "" : indoor ? "실내 " : "야외 "}${found.length}곳`
            const points = []
            for (const s of found) {
                const box = document.createElement("div")
                box.textContent = `${s.name} · ${s.area} · ${s.indoor ? "실내" : "야외"}\n${s.desc}`
                box.style.whiteSpace = "pre-line"
                L.marker([s.lat, s.lon]).addTo(layer).bindPopup(box)
                points.push([s.lat, s.lon])
            }
            map.fitBounds(points, { padding: [40, 40], maxZoom: 13 })
        }
        document.getElementById("go").onclick = search
        document.getElementById("q").onkeydown = (e) => { if (e.key === "Enter") search() }
    </script>
</body>
</html>
