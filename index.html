<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        #globe { position: fixed; inset: 0; }
        .panel { position: fixed; background: rgba(10, 14, 24, .78); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
        #info { top: 12px; left: 12px; }
        #info h1 { margin: 0 0 4px; font-size: 18px; }
        #legend { top: 12px; right: 12px; line-height: 1.7; }
        .dot { display: inline-block; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        #ctrl { bottom: 12px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 48px)); display: flex; align-items: center; gap: 10px; }
        #ctrl input[type=range] { flex: 1; }
        #ctrl button { padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        #clock { min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
    </style>
</head>
<body>
    <div id="globe"></div>
    <div id="info" class="panel">
        <h1>지금 지구의 지진</h1>
        <div id="stat">불러오는 중...</div>
    </div>
    <div id="legend" class="panel">
        <div><span class="dot" style="width:8px;height:8px;background:#ffd23f"></span>규모 4 미만</div>
        <div><span class="dot" style="width:12px;height:12px;background:#ff8c2b"></span>규모 4 ~ 5</div>
        <div><span class="dot" style="width:16px;height:16px;background:#ff3030"></span>규모 5 이상</div>
        <div style="font-size:12px;color:#aaa">출처: USGS</div>
    </div>
    <div id="ctrl" class="panel">
        <button id="play">▶ 24시간 재생</button>
        <input id="time" type="range" min="0" max="1000" value="1000">
        <span id="clock">현재</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
    <script>
        const FEED = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
        const HOUR = 3600 * 1000
        const color = (m) => (m >= 5 ? "#ff3030" : m >= 4 ? "#ff8c2b" : "#ffd23f")
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))

        let quakes = []      // 최근 24시간 지진
        let start = 0, end = 0
        let cursor = 0       // 화면에 보이는 기준 시각
        let playing = false

        const globe = Globe()(document.getElementById("globe"))
            .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/earth-night.jpg")
            .bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/earth-topology.png")
            .backgroundImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/night-sky.png")
            // 규모별로 커지는 점
            .pointLat("lat").pointLng("lng")
            .pointAltitude((q) => 0.01 + q.mag * 0.012)
            .pointRadius((q) => 0.15 + q.mag * 0.12)
            .pointColor((q) => color(q.mag))
            .pointLabel((q) => `<b>M ${q.mag.toFixed(1)}</b> ${esc(q.place)}<br>${new Date(q.time).toLocaleString()}<br>깊이 ${q.depth.toFixed(0)} km`)
            // 규모별로 번지는 원
            .ringLat("lat").ringLng("lng")
            .ringColor((q) => (t) => { const c = color(q.mag); return c + Math.round((1 - t) * 255).toString(16).padStart(2, "0") })
            .ringMaxRadius((q) => 1 + q.mag * 1.6)
            .ringPropagationSpeed((q) => 1 + q.mag * 0.5)
            .ringRepeatPeriod((q) => 1800 - q.mag * 150)

        globe.controls().autoRotate = true
        globe.controls().autoRotateSpeed = 0.4
        const resize = () => globe.width(innerWidth).height(innerHeight)
        addEventListener("resize", resize); resize()

        // cursor 시각까지 일어난 지진만 보여준다. 재생 중이면 방금 일어난 것(최근 1시간)에 원을 번지게 한다.
        const render = () => {
            const visible = quakes.filter((q) => q.time <= cursor)
            const rings = cursor >= end ? visible.filter((q) => q.mag >= 4) : visible.filter((q) => cursor - q.time < HOUR)
            globe.pointsData(visible).ringsData(rings)
            document.getElementById("stat").textContent =
                `${visible.length}건 · 최대 규모 ${Math.max(0, ...visible.map((q) => q.mag)).toFixed(1)}`
            document.getElementById("clock").textContent = cursor >= end ? "현재" : new Date(cursor).toLocaleTimeString()
            document.getElementById("time").value = end > start ? Math.round(((cursor - start) / (end - start)) * 1000) : 1000
        }

        // 24시간을 약 30초에 재생
        let last = 0
        const tick = (now) => {
            if (!playing) return
            cursor = Math.min(end, cursor + (now - last) * ((end - start) / 30000))
            last = now
            render()
            if (cursor >= end) stop(); else requestAnimationFrame(tick)
        }
        const stop = () => { playing = false; document.getElementById("play").textContent = "▶ 24시간 재생" }
        document.getElementById("play").onclick = () => {
            if (playing) return stop()
            if (cursor >= end) cursor = start
            playing = true; last = performance.now()
            document.getElementById("play").textContent = "⏸ 멈춤"
            requestAnimationFrame(tick)
        }
        document.getElementById("time").oninput = (e) => {
            stop()
            cursor = start + ((end - start) * e.target.value) / 1000
            render()
        }

        const load = async () => {
            try {
                const r = await fetch(FEED)
                if (!r.ok) throw new Error(r.status)
                const data = await r.json()
                quakes = data.features
                    .filter((f) => f.properties.mag != null)
                    .map((f) => ({
                        mag: f.properties.mag, place: f.properties.place || "", time: f.properties.time,
                        lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], depth: f.geometry.coordinates[2],
                    }))
                end = Date.now(); start = end - 24 * HOUR
                if (!playing) cursor = end
                render()
            } catch (e) {
                document.getElementById("stat").textContent = "지진 데이터를 불러오지 못했습니다."
            }
        }
        load()
        setInterval(load, 5 * 60 * 1000) // 5분마다 갱신
    </script>
</body>
</html>
